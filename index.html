<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta charset="utf-8">
<title>Daniel Track</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"/>
<style>
html, body { height:100%; margin:0; font-family:system-ui; background:#111; color:#eee; }
#login { position:fixed; inset:0; background:#111; display:flex; align-items:center; justify-content:center; z-index:9999; }
#login form { background:#1a1a1a; padding:2rem; border-radius:12px; text-align:center; }
input, button, select { padding:8px 12px; border-radius:6px; border:1px solid #444; background:#222; color:#eee; }
button { cursor:pointer; }
#lastping { color: #111; background: #e5e5e5; }
#app { display:none; flex-direction:column; height:100vh; height:100dvh; box-sizing:border-box; }
#main { display:flex; flex:1; min-height:0; }
#sidebar { width:320px; background:#1a1a1a; overflow-y:auto; border-right:1px solid #333; }
#sidebar h3 { margin:12px; font-size:16px; }
.clip { padding:10px 12px; border-bottom:1px solid #333; cursor:pointer; }
.clip:hover, .clip.active { background:#2a2a2a; }
.clip .time { font-weight:600; }
.clip .meta { font-size:12px; color:#aaa; margin-top:2px; }
.clip.home { border-left:3px solid #4ade80; }
#map-wrap { flex:1; display:flex; flex-direction:column; min-width:0; }
#controls { padding:8px 12px; background:#1a1a1a; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
#map { flex:1; min-height:200px; }
#subtitle, #speedline { text-align:center; padding:4px; background:#1a1a1a; font-size:14px; }
#speedline { color:#aaa; }
#footer { height:28px; line-height:28px; text-align:center; font-size:12px; background:#111; border-top:1px solid #333; }
@media (max-width:700px) {
  #sidebar { width:100%; max-height:40vh; }
  #main { flex-direction:column; }
}
@keyframes ping {
  0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.7); }
  70% { box-shadow: 0 0 0 12px rgba(59,130,246,0); }
  100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
}
.maplibregl-popup-content {
  color: #111;
  background: #fff;
}
.maplibregl-popup-close-button {
  color: #111;
}
</style>
</head>
<body>
<div id="login">
  <form onsubmit="return check(event)">
    <h3>Daniel Track</h3>
    <input type="password" id="pw" placeholder="password" autofocus>
    <br><br>
    <button type="submit">Enter</button>
  </form>
</div>
<div id="app">
  <div id="main">
    <div id="sidebar">
      <h3>Motion Clips</h3>
      <div id="cliplist"></div>
    </div>
    <div id="map-wrap">
      <div id="controls">
        <button id="play">Play</button>
        <button id="pause">Pause</button>
        <button id="lastping">Last ping</button>
        <label>Speed: <input type="range" id="speed" min="0.25" max="8" step="0.25" value="1"> <span id="speedval">1x</span></label>
        <label><input type="checkbox" id="sat"> Satellite</label>
        <label><input type="checkbox" id="realtime"> Real time</label>
        <span id="info"></span>
      </div>
      <input type="range" id="timeline" min="0" max="100" value="0" style="width:100%">
      <div id="subtitle"></div>
      <div id="speedline"></div>
      <div id="map"></div>
    </div>
  </div>
  <div id="footer">Daniel Track v2.0</div>
</div>
<script>
const PASS = "BustedBetch77";
const VERSION = "v2.0";
function setFooter(extra) { document.getElementById("footer").textContent = "Daniel Track " + VERSION + (extra ? " · " + extra : ""); }
function check(e) {
  e.preventDefault();
  if (document.getElementById("pw").value === PASS) {
    localStorage.setItem("dt_auth", "ok");
    show();
  } else alert("Wrong password");
  return false;
}
function show() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "flex";
  loadClips();
}
let map, marker, currentPts = [], idx = 0, playing = false, timer; let clips = [];
async function loadClips() {
  try {
    const r = await fetch("clips.json?t=" + Date.now());
    if (!r.ok) throw new Error("no clips.json");
    clips = await r.json();
  } catch (e) {
    document.getElementById("cliplist").innerHTML = "<div style='padding:12px;color:#aaa'>No clips.json found.<br>Run clip_processor.py first.</div>";
    return;
  }
  renderList();
  if (clips.length) selectClip(0);
}
function renderList() {
  const el = document.getElementById("cliplist");
  el.innerHTML = "";
  clips.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "clip" + (c.home_related ? " home" : "");
    d.innerHTML = `
      <div class="time">${fmtTime(c.start)}</div>
      <div class="meta">${Math.round(c.duration_sec/60)}m ${Math.round(c.duration_sec%60)}s · ${c.distance_m.toFixed(0)} m · ${c.avg_mph} mph${c.home_related ? " · home" : ""}</div>
    `;
    d.onclick = () => selectClip(i);
    el.appendChild(d);
  });
}
function selectClip(i) {
  document.querySelectorAll(".clip").forEach((el, j) => el.classList.toggle("active", j === i));
  const c = clips[i];
  currentPts = c.points;
  idx = 0;
  if (!map) initMap();
  else load(currentPts);
  document.getElementById("info").textContent = `Clip ${i+1}/${clips.length}`;
}
function initMap() {
  map = new maplibregl.Map({
    container: "map",
    style: {
      version: 8,
      sources: {
        streets: { type: "raster", tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 19, attribution: "Esri" },
        sat: { type: "raster", tiles: ["https://cache.gis.lacounty.gov/cache/rest/services/LACounty_Cache/LACounty_Aerial_2014/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, maxzoom: 20, attribution: "LA County LARIAC4" }
      },
      layers: [
        { id: "street", type: "raster", source: "streets" },
        { id: "sat", type: "raster", source: "sat", layout: { visibility: "none" } }
      ]
    },
    center: currentPts.length ? [currentPts[0][1], currentPts[0][0]] : [-118.3465, 34.102],
    zoom: 17,
    pitch: 0, bearing: 0, maxPitch: 0, minPitch: 0,
    dragRotate: false, pitchWithRotate: false, touchPitch: false
  });
  marker = new maplibregl.Marker({ color: "#ff6b6b" }).setLngLat(currentPts.length ? [currentPts[0][1], currentPts[0][0]] : [-118.3465, 34.102]).addTo(map);
  map.on("load", () => load(currentPts));
  document.getElementById("sat").onchange = applyBase;
}
function applyBase() {
  if (!map) return;
  const isSat = document.getElementById("sat").checked;
  map.setLayoutProperty("sat", "visibility", isSat ? "visible" : "none");
  map.setLayoutProperty("street", "visibility", isSat ? "none" : "visible");
}
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function mph(m) { return (m * 2.23694).toFixed(1); }
function fmtTime(ts) {
  return new Date(ts).toLocaleString("en-US", { month:"2-digit", day:"2-digit", hour:"numeric", minute:"2-digit", hour12:true, timeZone:"America/Los_Angeles" });
}
function getSpeed(i) {
  if (i < 1) return 0;
  const p1 = currentPts[i-1], p2 = currentPts[i];
  const d = haversine(p1[0], p1[1], p2[0], p2[1]);
  const s = (new Date(p2[2]) - new Date(p1[2])) / 1000;
  return s > 0 ? d / s : 0;
}
function update() {
  if (!currentPts.length) return;
  const p = currentPts[idx];
  document.getElementById("info").textContent = `${idx+1}/${currentPts.length} · ${fmtTime(p[2])}`;
  let pause = "";
  if (idx > 0) {
    const sec = Math.round((new Date(currentPts[idx][2]) - new Date(currentPts[idx-1][2])) / 1000);
    if (sec >= 5) {
      const m = Math.floor(sec/60), s = sec%60;
      pause = m ? `Paused ${m}m ${s}s` : `Paused ${s}s`;
    }
  }
  document.getElementById("subtitle").textContent = pause;
  const actual = getSpeed(idx);
  const mult = parseFloat(document.getElementById("speed").value);
  const rt = document.getElementById("realtime").checked;
  let st = `Actual: ${mph(actual)} mph`;
  if (!rt && mult !== 1) st += ` · ${mult}x (${mph(actual*mult)} mph)`;
  document.getElementById("speedline").textContent = st;
}
function centerOn(i, smooth) {
  if (!map || !marker || !currentPts[i]) return;
  const p = currentPts[i];
  marker.setLngLat([p[1], p[0]]);
  if (smooth) map.easeTo({ center: [p[1], p[0]], pitch: 0, bearing: 0, duration: 300 });
  else map.jumpTo({ center: [p[1], p[0]], pitch: 0, bearing: 0 });
}
function step() {
  if (!playing || idx >= currentPts.length) return;
  centerOn(idx, true);
  document.getElementById("timeline").value = idx;
  update();
  idx++;
  if (idx < currentPts.length) {
    let delay = 350 / parseFloat(document.getElementById("speed").value);
    if (document.getElementById("realtime").checked) {
      const sec = (new Date(currentPts[idx][2]) - new Date(currentPts[idx-1][2])) / 1000;
      delay = Math.max(80, sec * 1000);
    }
    timer = setTimeout(step, delay);
  } else playing = false;
}
function load(pts) {
  currentPts = pts; idx = 0;
  if (!pts.length) return;
  map.jumpTo({ center: [pts[0][1], pts[0][0]], zoom: 17, pitch: 0, bearing: 0 });
  document.getElementById("timeline").max = pts.length - 1;
  document.getElementById("timeline").value = 0;
  centerOn(0, false); update();
}
document.getElementById("play").onclick = () => { if (playing) return; playing = true; if (idx >= currentPts.length) idx = 0; step(); };
document.getElementById("pause").onclick = () => { playing = false; clearTimeout(timer); };
document.getElementById("speed").oninput = e => { document.getElementById("speedval").textContent = e.target.value + "x"; update(); };
document.getElementById("timeline").oninput = e => {
  playing = false; clearTimeout(timer);
  idx = parseInt(e.target.value);
  centerOn(idx, false); update();
};
document.getElementById("realtime").onchange = () => update();

document.getElementById("lastping").onclick = () => {
  if (!clips.length) return;
  // Prefer the most recent clip that has points
  let lastClip = clips[clips.length - 1];
  const pts = lastClip.points;
  if (!pts.length) return;
  const p = pts[pts.length - 1];
  if (window.pingMarker) window.pingMarker.remove();
  const el = document.createElement("div");
  el.style.cssText = "width:18px;height:18px;border-radius:50%;background:#3b82f6;box-shadow:0 0 0 0 rgba(59,130,246,0.7);animation:ping 1.5s infinite;";
  window.pingMarker = new maplibregl.Marker({element: el})
    .setLngLat([p[1], p[0]])
    .setPopup(new maplibregl.Popup().setHTML(`Last ping<br>${fmtTime(p[2])}`))
    .addTo(map)
    .togglePopup();
  map.easeTo({center: [p[1], p[0]], zoom: 17});
};

if (localStorage.getItem("dt_auth") === "ok") show();
</script>
</body>
</html>
