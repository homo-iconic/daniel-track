const segLabels = ["10/13/26 09:38 PM \u2192 10/13/26 09:39 PM (2 pts)", "10/14/26 12:01 AM \u2192 10/14/26 12:14 AM (11 pts)", "10/14/26 12:16 AM \u2192 10/14/26 12:17 AM (2 pts)", "10/14/26 12:27 AM \u2192 10/14/26 12:29 AM (2 pts)", "10/14/26 12:31 AM \u2192 10/14/26 12:32 AM (2 pts)", "10/14/26 12:35 AM \u2192 10/14/26 12:36 AM (2 pts)", "10/14/26 12:37 AM \u2192 10/14/26 12:39 AM (2 pts)", "10/14/26 12:40 AM \u2192 10/14/26 12:42 AM (3 pts)", "10/14/26 12:44 AM \u2192 10/14/26 12:52 AM (8 pts)", "10/14/26 12:54 AM \u2192 10/14/26 12:55 AM (2 pts)", "10/14/26 01:00 AM \u2192 10/14/26 01:01 AM (2 pts)", "10/14/26 01:02 AM \u2192 10/14/26 01:06 AM (4 pts)", "10/14/26 01:10 AM \u2192 10/14/26 01:11 AM (2 pts)"];

const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      streets: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256
      },
      sat: {
        type: 'raster',
        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize: 256
      }
    },
    layers: [
      { id: 'street', type: 'raster', source: 'streets' },
      { id: 'sat', type: 'raster', source: 'sat', layout: { visibility: 'none' } }
    ]
  },
  center: [-118.35, 34.10],
  zoom: 18,
  pitch: 0,
  bearing: 0,
  dragRotate: false,
  pitchWithRotate: false,
  touchPitch: false
});

map.on('load', () => {
  map.setPitch(0);
  map.setBearing(0);
  load(allPoints);
});

let currentPts = allPoints, idx = 0, playing = false, timer;
const marker = new maplibregl.Marker({ color: '#ff6b6b' }).setLngLat([allPoints[0][1], allPoints[0][0]]).addTo(map);

const sel = document.getElementById('seg');
segLabels.forEach((label, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = label; sel.appendChild(o);
});
const allOpt = document.createElement('option');
allOpt.value = 'all'; allOpt.textContent = 'Full track (' + allPoints.length + ' pts)';
sel.prepend(allOpt); sel.value = 'all';

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function mph(mps) { return (mps * 2.23694).toFixed(1); }
function fmtTime(ts) {
  return new Date(ts).toLocaleString('en-US', {month:'2-digit',day:'2-digit',year:'2-digit',hour:'numeric',minute:'2-digit',hour12:true,timeZone:'America/Los_Angeles'});
}
function getSpeed(i) {
  if (i < 1) return 0;
  const p1 = currentPts[i-1], p2 = currentPts[i];
  const dist = haversine(p1[0], p1[1], p2[0], p2[1]);
  const sec = (new Date(p2[2]) - new Date(p1[2])) / 1000;
  return sec > 0 ? dist / sec : 0;
}

function update() {
  if (!currentPts.length) return;
  const p = currentPts[idx];
  document.getElementById('info').textContent = `${idx+1}/${currentPts.length} · ${fmtTime(p[2])}`;
  let pause = '';
  if (idx > 0) {
    const sec = Math.round((new Date(currentPts[idx][2]) - new Date(currentPts[idx-1][2])) / 1000);
    if (sec >= 5) {
      const m = Math.floor(sec/60), s = sec%60;
      pause = m ? `Paused ${m}m ${s}s` : `Paused ${s}s`;
    }
  }
  document.getElementById('subtitle').textContent = pause;
  const actual = getSpeed(idx);
  const mult = parseFloat(document.getElementById('speed').value);
  const rt = document.getElementById('realtime').checked;
  let st = `Actual: ${mph(actual)} mph`;
  if (!rt && mult !== 1) st += ` · ${mult}x (${mph(actual*mult)} mph)`;
  document.getElementById('speedline').textContent = st;
}

function centerOn(i) {
  const p = currentPts[i];
  marker.setLngLat([p[1], p[0]]);
  map.jumpTo({ center: [p[1], p[0]], pitch: 0, bearing: 0 });
}

function step() {
  if (!playing || idx >= currentPts.length) return;
  centerOn(idx);
  document.getElementById('timeline').value = idx;
  update();
  idx++;
  if (idx < currentPts.length) {
    let delay = 350 / parseFloat(document.getElementById('speed').value);
    if (document.getElementById('realtime').checked) {
      const sec = (new Date(currentPts[idx][2]) - new Date(currentPts[idx-1][2])) / 1000;
      delay = Math.max(80, sec * 1000);
    }
    timer = setTimeout(step, delay);
  } else playing = false;
}

function load(pts) {
  currentPts = pts; idx = 0;
  if (!pts.length) return;
  const bounds = new maplibregl.LngLatBounds();
  pts.forEach(p => bounds.extend([p[1], p[0]]));
  map.fitBounds(bounds, { padding: 50, pitch: 0, bearing: 0 });
  document.getElementById('timeline').max = pts.length - 1;
  document.getElementById('timeline').value = 0;
  centerOn(0);
  update();
}

sel.onchange = () => {
  playing = false; clearTimeout(timer);
  load(sel.value === 'all' ? allPoints : segments[parseInt(sel.value)]);
};
document.getElementById('play').onclick = () => {
  if (playing) return;
  playing = true;
  if (idx >= currentPts.length) idx = 0;
  step();
};
document.getElementById('pause').onclick = () => { playing = false; clearTimeout(timer); };
document.getElementById('speed').oninput = e => {
  document.getElementById('speedval').textContent = e.target.value + 'x';
  update();
};
document.getElementById('timeline').oninput = e => {
  playing = false; clearTimeout(timer);
  idx = parseInt(e.target.value);
  centerOn(idx);
  update();
};
document.getElementById('sat').onchange = e => {
  map.setLayoutProperty('sat', 'visibility', e.target.checked ? 'visible' : 'none');
  map.setLayoutProperty('street', 'visibility', e.target.checked ? 'none' : 'visible');
};
document.getElementById('realtime').onchange = () => update();
</script>
